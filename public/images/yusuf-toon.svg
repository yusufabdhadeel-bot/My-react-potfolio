<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Yusuf stylized portrait</title>
  <desc id="desc">A cool blue posterized portrait of Yusuf.</desc>
  <defs>
    <filter id="toon" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues=".08 .18 .34 .58 .82" />
        <feFuncG type="discrete" tableValues=".12 .24 .42 .66 .9" />
        <feFuncB type="discrete" tableValues=".18 .34 .55 .78 1" />
      </feComponentTransfer>
      <feColorMatrix type="saturate" values="1.25" />
      <feConvolveMatrix order="3" kernelMatrix="-1 -1 -1 -1 9 -1 -1 -1 -1" preserveAlpha="true" />
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".3" />
      <stop offset=".45" stop-color="#bfe7ff" stop-opacity=".04" />
      <stop offset="1" stop-color="#2c99e8" stop-opacity=".18" />
    </linearGradient>
  </defs>
  <image href="/images/selfie.jpg" xlink:href="/images/selfie.jpg" width="1024" height="1024" preserveAspectRatio="xMidYMid meet" filter="url(#toon)" />
  <rect width="1024" height="1024" fill="url(#sheen)" />
</svg>
